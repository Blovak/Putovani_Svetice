<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5d38">
  <meta name="robots" content="noindex">
  <title>Mapa celkové vzdálenosti – Světické kilometrobraní</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="admin-vzdalenost.css?v=32">
</head>
<body>
  <main id="distanceMap" aria-label="Interaktivní mapa celkové ušlé vzdálenosti"></main>

  <aside class="distance-panel" aria-labelledby="distanceTitle">
    <p class="eyebrow">Statistiky</p>
    <h1 id="distanceTitle">Kam jsme až došli</h1>
    <p id="distanceStatus" class="distance-status" aria-live="polite">Načítám aktuální vzdálenost…</p>

    <p id="distanceExplanation" class="distance-explanation hidden">
      Zelený kruh ukazuje, kam až bychom ze Světic došli po společně ušlé
      vzdálenosti. Aktualizuje se každých pět minut.
    </p>

    <div class="distance-actions">
      <button id="fitCircleButton" class="map-button hidden" type="button">Zobrazit celý kruh</button>
      <button id="centerButton" class="map-button map-button--secondary hidden" type="button">Přiblížit Světice</button>
      <button id="backButton" class="map-button map-button--back" type="button">Zpět ke statistikám</button>
    </div>
  </aside>

  <noscript>Pro zobrazení mapy je potřeba povolit JavaScript.</noscript>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="admin-vzdalenost.js?v=33"></script>
</body>
</html>
